<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigame Roubo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="minigame-container" style="display: none;">
        <div class="header">
            <span>TEMPO RESTANTE</span>
            <span id="time-display">5.0</span>
        </div>
        <div class="progress-bar-container">
            <div id="time-bar" class="progress-bar"></div>
        </div>

        <div class="items-container">
            <div class="item-box common" id="box-common">
                <img id="img-common" src="" alt="Common">
            </div>
            <div class="item-box uncommon" id="box-uncommon">
                <img id="img-uncommon" src="" alt="Uncommon">
            </div>
            <div class="item-box rare" id="box-rare">
                <img id="img-rare" src="" alt="Rare">
            </div>
        </div>

        <div class="slider-container">
            <!-- Zones will be positioned via JS based on percentages -->
            <div id="zone-common" class="zone common-zone"></div>
            <div id="zone-uncommon" class="zone uncommon-zone"></div>
            <div id="zone-rare" class="zone rare-zone"></div>
            <div id="slider-cursor" class="cursor"></div>
        </div>

        <div class="footer">
            Aperte <span class="key-hint">ESPAÇO</span> PARA PEGAR UM ITEM
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
