## ================================================
##  FDB-System Server Configuration
## ================================================

## server main settings
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set gamename rdr3
set sv_enforceGameBuild 1491

# locale config
setr qb_locale "pt-br"
setr rsg_locale "pt-br"
setr ox:locale pt-br

## key license settings
sv_licenseKey "{{svLicense}}"

# Steam Web API Key (https://steamcommunity.com/dev/apikey)
set steam_webApiKey "YOUR_STEAM_API_KEY"
set sv_enforceSteamAuth false

## database settings
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 300

## voice settings
setr voice_useSendingRangeOnly false
setr voice_use3dAudio true
setr voice_defaultVoiceMode 2
setr voice_enableUi 1

## server display settings
sv_hostname "{{serverName}} built with {{recipeName}} by {{recipeAuthor}}!"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "pt-BR"
sets Framework "FDB"
sets tags "fdb,roleplay,redm"

set txAdmin-menuPtfxDisable true
set sv_experimentalNetGameEventHandler false

# ox_lib theme
setr ox:primaryColor red
setr ox:primaryShade 8

# target system
setr UseTarget false

## ================================================
##  Resource Start Order
## ================================================

# base FXServer resources
ensure mapmanager
ensure spawnmanager
ensure sessionmanager-rdr3

# database (must start first)
ensure oxmysql

# libraries
ensure ox_lib

# framework core (must start before all fdb resources)
ensure fdb-core

# framework resources (order matters)
ensure fdb-multicharacter
ensure fdb-inventory
ensure fdb-spawn
ensure fdb-horses

# standalone resources
ensure PolyZone
ensure progressbar
ensure rNotify
ensure interact-sound
ensure weathersync
ensure pma-voice
ensure redm-female-fix

## ================================================
##  Permissions
## ================================================

# weathersync permissions
exec resources/[standalone]/weathersync/permissions.cfg

# allow all commands for admins
add_ace group.admin command allow

# resource permissions
add_ace resource.fdb-core command allow

# ox_lib permissions
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

###################### GOD ######################
# add_principal identifier.license:YOUR_LICENSE_HERE fdbcore.god
# add_principal identifier.license:YOUR_LICENSE_HERE fdbcore.admin
# add_principal identifier.license:YOUR_LICENSE_HERE group.admin
###################### ADMIN ####################
# add_principal identifier.license:YOUR_LICENSE_HERE fdbcore.admin
# add_principal identifier.license:YOUR_LICENSE_HERE group.admin
#################################################

# god permissions
add_ace fdbcore.god command allow

# inheritance chain: god > admin > mod
add_principal fdbcore.god group.admin
add_principal fdbcore.god fdbcore.admin
add_principal fdbcore.admin fdbcore.mod
