    dest: ./resources/[framework]/fdb-weapons

  - action: move_path
    src: ./tmp/FDBSystem/fdb-ammo
    dest: ./resources/[framework]/fdb-ammo

  - action: move_path
    src: ./tmp/FDBSystem/fdb-shops
    dest: ./resources/[framework]/fdb-shops

  - action: move_path
    src: ./tmp/FDBSystem/fdb-radialmenu
    dest: ./resources/[framework]/fdb-radialmenu



  - action: move_path
