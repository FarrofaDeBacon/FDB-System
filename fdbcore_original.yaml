$engine: 3
$onesync: on
name: FDB-System RedM Build
version: 1.0.0
author: Farrofa De Bacon
description: FDB-System RedM Server Build

tasks:
  # ================================================
  #  Download FDB-System repo (contains EVERYTHING)
  # ================================================
  - action: download_github
    src: https://github.com/FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    dest: ./tmp/FDBSystem

  # Setup server config
  - action: move_path
    src: ./tmp/FDBSystem/txAdminRecipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/FDBSystem/txAdminRecipe/myLogo.png
    dest: ./myLogo.png

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/FDBSystem/txAdminRecipe/fdbcore.sql

  # ================================================
  #  External Resources (not in our repo)
  # ================================================

  # Base FXServer resources
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]

  # oxmysql
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip

  # pma-voice
  - action: download_github
    dest: ./resources/[standalone]/pma-voice
    ref: main
    src: https://github.com/AvarianKnight/pma-voice

  # xsound
  - action: download_github
    dest: ./resources/[standalone]/xsound
    ref: master
    src: https://github.com/Xogy/xsound

  # redm-female-fix
  - action: download_github
    dest: ./resources/[standalone]/redm-female-fix
    ref: main
    src: https://github.com/Popisek/redm-female-fix

  - action: waste_time
    seconds: 10

  # ================================================
  #  Standalone Resources (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/ox_lib
    dest: ./resources/[standalone]/ox_lib

  - action: move_path
    src: ./tmp/FDBSystem/progressbar
    dest: ./resources/[standalone]/progressbar

  - action: move_path
    src: ./tmp/FDBSystem/PolyZone
    dest: ./resources/[standalone]/PolyZone

  - action: move_path
    src: ./tmp/FDBSystem/weathersync
    dest: ./resources/[standalone]/weathersync

  - action: move_path
    src: ./tmp/FDBSystem/interact-sound
    dest: ./resources/[standalone]/interact-sound

  - action: move_path
    src: ./tmp/FDBSystem/menu_base
    dest: ./resources/[standalone]/menu_base

  - action: move_path
    src: ./tmp/FDBSystem/chat-redm
    dest: ./resources/[standalone]/chat-redm

  - action: move_path
    src: ./tmp/FDBSystem/rNotify
    dest: ./resources/[standalone]/rNotify

  - action: move_path
    src: ./tmp/FDBSystem/ox_target
    dest: ./resources/[standalone]/ox_target



  # ================================================
  #  Framework Resources (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/fdb-libs
    dest: ./resources/[framework]/fdb-libs

  - action: move_path
    src: ./tmp/FDBSystem/fdb-core
    dest: ./resources/[framework]/fdb-core

  - action: move_path
    src: ./tmp/FDBSystem/fdb-inventory
    dest: ./resources/[framework]/fdb-inventory

  - action: move_path
    src: ./tmp/FDBSystem/fdb-multicharacter
    dest: ./resources/[framework]/fdb-multicharacter

  - action: move_path
    src: ./tmp/FDBSystem/fdb-creator
    dest: ./resources/[framework]/fdb-creator

  - action: move_path
    src: ./tmp/FDBSystem/fdb-wardrobe
    dest: ./resources/[framework]/fdb-wardrobe

  - action: move_path
    src: ./tmp/FDBSystem/fdb-medic
    dest: ./resources/[framework]/fdb-medic

  - action: move_path
    src: ./tmp/FDBSystem/fdb-lawman
    dest: ./resources/[framework]/fdb-lawman

  - action: move_path
    src: ./tmp/FDBSystem/fdb-prison
    dest: ./resources/[framework]/fdb-prison



  - action: move_path
