    dest: ./resources/[framework]/fdb-mdt

  # ================================================
  #  Map Mods (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/redm-ipls
    dest: ./resources/[mapmods]/redm-ipls

  - action: move_path
    src: ./tmp/FDBSystem/redm-ymaps
    dest: ./resources/[mapmods]/redm-ymaps

  # ================================================
  #  Cleanup
  # ================================================

  # Remove old chat (conflicts with RedM)
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Clean up temp files
  - action: remove_path
    path: ./tmp
