$engine: 3
$onesync: on
name: FDB-System-Base
version: 1.0.0
author: FarrofaDeBacon
description: Receita txAdmin automatizada e 100% autossuficiente para deploy completo da base FDB-System (RedM).

tasks:
  # 1. Driver MySQL (Release Oficial Overextended)
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[core]
    src: ./tmp/files/oxmysql.zip

  # 2. Bibliotecas e Dependências Standalone (Direct FDB-System)
  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: ox_lib
    dest: ./resources/[core]/ox_lib

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: progressbar
    dest: ./resources/[core]/progressbar

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: weathersync
    dest: ./resources/[core]/weathersync

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: PolyZone
    dest: ./resources/[core]/PolyZone

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: rNotify
    dest: ./resources/[core]/rNotify

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: interact-sound
    dest: ./resources/[core]/interact-sound

  # 3. Framework Core FDB-System
  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: FDB-Core
    dest: ./resources/[fdb]/fdb-core

  # 4. Recursos Companheiros FDB-System
  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: fdb-spawn
    dest: ./resources/[fdb]/fdb-spawn

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: fdb-multicharacter
    dest: ./resources/[fdb]/fdb-multicharacter

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: fdb-inventory
    dest: ./resources/[fdb]/fdb-inventory

  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: fdb-horses
    dest: ./resources/[fdb]/fdb-horses

  # 5. Conexão e Criação do Banco de Dados MySQL
  - action: connect_database
  - action: download_github
    src: FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    subpath: fdbcore.sql
    dest: ./tmp/fdbcore.sql
  - action: query_database
    file: ./tmp/fdbcore.sql

  # 6. Geração do server.cfg
  - action: write_file
    file: ./server.cfg
    append: true
    data: |
      # ================================================
      #          FDB-System Base Configuration
      # ================================================

      # --- Identificação do Jogo (RedM) ---
      set gamename rdr3

      endpoint_add_tcp "0.0.0.0:30120"
      endpoint_add_udp "0.0.0.0:30120"

      # --- Conexão MySQL ---
      set mysql_connection_string "{{dbConnectionString}}"

      # --- Ordem de Inicialização dos Recursos ---
      ensure oxmysql
      ensure ox_lib
      ensure progressbar
      ensure weathersync
      ensure PolyZone
      ensure rNotify
      ensure interact-sound
      ensure fdb-core
      ensure fdb-spawn
      ensure fdb-multicharacter
      ensure fdb-inventory
      ensure fdb-horses

      # --- Configurações Gerais do Servidor RedM ---
      sv_scriptHookAllowed 0
      sv_maxclients 48
      set sv_licenseKey "{{svLicense}}"
      set steam_webApiKey "{{steamApiKey}}"
