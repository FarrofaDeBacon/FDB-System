$engine: 3
$onesync: on
name: FDB-System RedM Build
version: 1.0.0
author: Farrofa De Bacon
description: FDB-System RedM Server Build

tasks:
  # Download all FDB-System files from our repository
  - action: download_github
    src: https://github.com/FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    dest: ./tmp/FDBSystem

  # Setup server config
  - action: move_path
    src: ./tmp/FDBSystem/server.cfg
    dest: ./server.cfg

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/FDBSystem/fdbcore.sql

  # ================================================
  #  External Standalone Resources
  # ================================================

  # Base FXServer resources
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]

  # oxmysql (database driver)
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip

  # pma-voice (voice chat)
  - action: download_github
    dest: ./resources/[standalone]/pma-voice
    ref: main
    src: https://github.com/AvarianKnight/pma-voice

  # redm-female-fix
  - action: download_github
    dest: ./resources/[standalone]/redm-female-fix
    ref: main
    src: https://github.com/Popisek/redm-female-fix

  - action: waste_time
    seconds: 10

  # ================================================
  #  FDB Standalone Resources (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/ox_lib
    dest: ./resources/[standalone]/ox_lib

  - action: move_path
    src: ./tmp/FDBSystem/progressbar
    dest: ./resources/[standalone]/progressbar

  - action: move_path
    src: ./tmp/FDBSystem/PolyZone
    dest: ./resources/[standalone]/PolyZone

  - action: move_path
    src: ./tmp/FDBSystem/weathersync
    dest: ./resources/[standalone]/weathersync

  - action: move_path
    src: ./tmp/FDBSystem/interact-sound
    dest: ./resources/[standalone]/interact-sound

  - action: move_path
    src: ./tmp/FDBSystem/rNotify
    dest: ./resources/[standalone]/rNotify

  # ================================================
  #  FDB Framework Resources (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/FDB-Core
    dest: ./resources/[framework]/fdb-core

  - action: move_path
    src: ./tmp/FDBSystem/fdb-inventory
    dest: ./resources/[framework]/fdb-inventory

  - action: move_path
    src: ./tmp/FDBSystem/fdb-multicharacter
    dest: ./resources/[framework]/fdb-multicharacter

  - action: move_path
    src: ./tmp/FDBSystem/fdb-spawn
    dest: ./resources/[framework]/fdb-spawn

  - action: move_path
    src: ./tmp/FDBSystem/fdb-horses
    dest: ./resources/[framework]/fdb-horses

  # ================================================
  #  Cleanup
  # ================================================

  # Remove old chat (conflicts with RedM)
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Clean up temp files
  - action: remove_path
    path: ./tmp
