$engine: 3
$onesync: on
name: FDB-System RedM Build
version: 1.0.0
author: Farrofa De Bacon
description: FDB-System RedM Server Build (fork completo RSG)

tasks:
  # ================================================
  #  Download FDB-System repo (contains everything)
  # ================================================
  - action: download_github
    src: https://github.com/FarrofaDeBacon/FDB-System
    ref: fix/companion-inventory-audit
    dest: ./tmp/FDBSystem

  # Setup server config
  - action: move_path
    src: ./tmp/FDBSystem/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/FDBSystem/myLogo.png
    dest: ./myLogo.png

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/FDBSystem/rsgcore_original.sql

  # ================================================
  #  External Resources (not in our repo)
  # ================================================

  # Base FXServer resources
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]

  # oxmysql
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip

  # pma-voice
  - action: download_github
    dest: ./resources/[standalone]/pma-voice
    ref: main
    src: https://github.com/AvarianKnight/pma-voice

  # xsound
  - action: download_github
    dest: ./resources/[standalone]/xsound
    ref: master
    src: https://github.com/Xogy/xsound

  # redm-female-fix
  - action: download_github
    dest: ./resources/[standalone]/redm-female-fix
    ref: main
    src: https://github.com/Popisek/redm-female-fix

  - action: waste_time
    seconds: 10

  # ================================================
  #  Standalone Resources (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/ox_lib
    dest: ./resources/[standalone]/ox_lib

  - action: move_path
    src: ./tmp/FDBSystem/progressbar
    dest: ./resources/[standalone]/progressbar

  - action: move_path
    src: ./tmp/FDBSystem/PolyZone
    dest: ./resources/[standalone]/PolyZone

  - action: move_path
    src: ./tmp/FDBSystem/weathersync
    dest: ./resources/[standalone]/weathersync

  - action: move_path
    src: ./tmp/FDBSystem/interact-sound
    dest: ./resources/[standalone]/interact-sound

  - action: move_path
    src: ./tmp/FDBSystem/menu_base
    dest: ./resources/[standalone]/menu_base

  - action: move_path
    src: ./tmp/FDBSystem/chat-redm
    dest: ./resources/[standalone]/chat-redm

  - action: move_path
    src: ./tmp/FDBSystem/rNotify
    dest: ./resources/[standalone]/rNotify

  - action: move_path
    src: ./tmp/FDBSystem/ox_target
    dest: ./resources/[standalone]/ox_target

  - action: move_path
    src: ./tmp/FDBSystem/ox_doorlock
    dest: ./resources/[standalone]/ox_doorlock

  # ================================================
  #  Framework Resources (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/rsg-core
    dest: ./resources/[framework]/rsg-core

  - action: move_path
    src: ./tmp/FDBSystem/rsg-inventory
    dest: ./resources/[framework]/rsg-inventory

  - action: move_path
    src: ./tmp/FDBSystem/rsg-multicharacter
    dest: ./resources/[framework]/rsg-multicharacter

  - action: move_path
    src: ./tmp/FDBSystem/rsg-appearance
    dest: ./resources/[framework]/rsg-appearance

  - action: move_path
    src: ./tmp/FDBSystem/rsg-wardrobe
    dest: ./resources/[framework]/rsg-wardrobe

  - action: move_path
    src: ./tmp/FDBSystem/rsg-medic
    dest: ./resources/[framework]/rsg-medic

  - action: move_path
    src: ./tmp/FDBSystem/rsg-lawman
    dest: ./resources/[framework]/rsg-lawman

  - action: move_path
    src: ./tmp/FDBSystem/rsg-prison
    dest: ./resources/[framework]/rsg-prison

  - action: move_path
    src: ./tmp/FDBSystem/rsg-doorlock
    dest: ./resources/[framework]/rsg-doorlock

  - action: move_path
    src: ./tmp/FDBSystem/rsg-banking
    dest: ./resources/[framework]/rsg-banking

  - action: move_path
    src: ./tmp/FDBSystem/rsg-spawn
    dest: ./resources/[framework]/rsg-spawn

  - action: move_path
    src: ./tmp/FDBSystem/rsg-weapons
    dest: ./resources/[framework]/rsg-weapons

  - action: move_path
    src: ./tmp/FDBSystem/rsg-ammo
    dest: ./resources/[framework]/rsg-ammo

  - action: move_path
    src: ./tmp/FDBSystem/rsg-shops
    dest: ./resources/[framework]/rsg-shops

  - action: move_path
    src: ./tmp/FDBSystem/rsg-radialmenu
    dest: ./resources/[framework]/rsg-radialmenu

  - action: move_path
    src: ./tmp/FDBSystem/rsg-essentials
    dest: ./resources/[framework]/rsg-essentials

  - action: move_path
    src: ./tmp/FDBSystem/rsg-telegram
    dest: ./resources/[framework]/rsg-telegram

  - action: move_path
    src: ./tmp/FDBSystem/rsg-horses
    dest: ./resources/[framework]/rsg-horses

  - action: move_path
