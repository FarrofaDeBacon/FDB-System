    dest: ./resources/[framework]/rsg-menubase

  - action: move_path
    src: ./tmp/FDBSystem/rsg-playerinfo
    dest: ./resources/[framework]/rsg-playerinfo

  - action: move_path
    src: ./tmp/FDBSystem/rsg-bossmenu
    dest: ./resources/[framework]/rsg-bossmenu

  - action: move_path
    src: ./tmp/FDBSystem/rsg-gangmenu
    dest: ./resources/[framework]/rsg-gangmenu

  - action: move_path
    src: ./tmp/FDBSystem/rsg-npcs
    dest: ./resources/[framework]/rsg-npcs

  - action: move_path
    src: ./tmp/FDBSystem/rsg-canteen
    dest: ./resources/[framework]/rsg-canteen

  - action: move_path
    src: ./tmp/FDBSystem/rsg-barbers
    dest: ./resources/[framework]/rsg-barbers

  - action: move_path
    src: ./tmp/FDBSystem/rsg-bathing
    dest: ./resources/[framework]/rsg-bathing

  - action: move_path
    src: ./tmp/FDBSystem/rsg-lockpick
    dest: ./resources/[framework]/rsg-lockpick

  - action: move_path
    src: ./tmp/FDBSystem/rsg-adminmenu
    dest: ./resources/[framework]/rsg-adminmenu

  - action: move_path
    src: ./tmp/FDBSystem/rsg-animations
    dest: ./resources/[framework]/rsg-animations

  - action: move_path
    src: ./tmp/FDBSystem/rsg-multijob
    dest: ./resources/[framework]/rsg-multijob

  - action: move_path
    src: ./tmp/FDBSystem/rsg-consume
    dest: ./resources/[framework]/rsg-consume

  - action: move_path
    src: ./tmp/FDBSystem/rsg-fishing
    dest: ./resources/[framework]/rsg-fishing

  - action: move_path
    src: ./tmp/FDBSystem/rsg-weaponcomp
    dest: ./resources/[framework]/rsg-weaponcomp

  - action: move_path
    src: ./tmp/FDBSystem/rsg-loading
    dest: ./resources/[framework]/rsg-loading

  - action: move_path
    src: ./tmp/FDBSystem/rsg-mdt
    dest: ./resources/[framework]/rsg-mdt

  # ================================================
  #  Map Mods (from our repo)
  # ================================================

  - action: move_path
    src: ./tmp/FDBSystem/redm-ipls
    dest: ./resources/[mapmods]/redm-ipls

  - action: move_path
    src: ./tmp/FDBSystem/redm-ymaps
    dest: ./resources/[mapmods]/redm-ymaps

  # ================================================
  #  Cleanup
  # ================================================

  # Remove old chat (conflicts with RedM)
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Clean up temp files
  - action: remove_path
    path: ./tmp
