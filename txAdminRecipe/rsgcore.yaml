    ref: main
    dest: ./resources/[framework]/fdb-doorlock

  - action: waste_time # prevent github throttling
    seconds: 10

  - action: download_github
    src: https://github.com/Rexshack-RedM/fdb-banking
    ref: main
    dest: ./resources/[framework]/fdb-banking

