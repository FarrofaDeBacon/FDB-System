  # Download Rexshack MapMod resources

  - action: download_github
    src: https://github.com/Rexshack-RedM/redm-ipls
    ref: main
    dest: ./resources/[mapmods]/redm-ipls

  - action: download_github
    src: https://github.com/Rexshack-RedM/redm-ymaps
    ref: main
