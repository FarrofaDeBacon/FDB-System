$engine: 3
$onesync: on
name: Rexshack RedM Build
version: 1.0.0
author: Rexshack Gaming
description: RSG RedM Server Build

tasks:
  #  Download Base Files
  - action: download_github
    src: https://github.com/Rexshack-RedM/txAdminRecipe
    ref: main
    dest: ./tmp/FDBCore

  - action: move_path
    src: ./tmp/FDBCore/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/FDBCore/myLogo.png
    dest: ./myLogo.png

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/FDBCore/fdbcore.sql

  # Downloading Standalone Resources  
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip
    
  - action: download_github
    dest: ./resources/[standalone]/ox_lib
    ref: main
    src: https://github.com/Rexshack-RedM/ox_lib

  - action: download_github
    dest: ./resources/[standalone]/progressbar
    ref: main
    src: https://github.com/Rexshack-RedM/progressbar

  - action: download_github
    dest: ./resources/[standalone]/PolyZone
    ref: main
    src: https://github.com/Rexshack-RedM/PolyZone

  - action: download_github
    dest: ./resources/[standalone]/pma-voice
    ref: main
    src: https://github.com/AvarianKnight/pma-voice

  - action: download_github
    dest: ./resources/[standalone]/weathersync
    ref: main
    src: https://github.com/Rexshack-RedM/weathersync

  - action: download_github
    dest: ./resources/[standalone]/xsound
    ref: master
    src: https://github.com/Xogy/xsound

  - action: download_github
    dest: ./resources/[standalone]/interact-sound 
    ref: main
    src: https://github.com/Rexshack-RedM/interact-sound 

  - action: download_github
    dest: ./resources/[standalone]/menu_base
    ref: main
    src: https://github.com/Rexshack-RedM/menu_base

  - action: download_github
    dest: ./resources/[standalone]/chat-redm
    ref: main
    src: https://github.com/Rexshack-RedM/chat-redm

  - action: download_github
    dest: ./resources/[standalone]/rNotify
    ref: main
    src: https://github.com/Rexshack-RedM/rNotify

  - action: download_github
    dest: ./resources/[standalone]/ox_target
    ref: main
    src: https://github.com/Rexshack-RedM/ox_target

  - action: download_github
    dest: ./resources/[standalone]/ox_doorlock
    ref: main
    src: https://github.com/Rexshack-RedM/ox_doorlock
    
  - action: download_github
    dest: ./resources/[standalone]/redm-female-fix
    ref: main
    src: https://github.com/Popisek/redm-female-fix

  - action: waste_time # prevent github throttling
    seconds: 10

  # Download FDBCore resources

  - action: download_github
    src: https://github.com/Rexshack-RedM/fdb-core
    ref: main
    dest: ./resources/[framework]/fdb-core

  - action: download_github
    src: https://github.com/Rexshack-RedM/fdb-inventory
    ref: main
    dest: ./resources/[framework]/fdb-inventory

  - action: download_github
    src: https://github.com/Rexshack-RedM/fdb-multicharacter
    ref: main
    dest: ./resources/[framework]/fdb-multicharacter

  - action: download_github
    src: https://github.com/Rexshack-RedM/fdb-appearance
    ref: main
    dest: ./resources/[framework]/fdb-appearance

  - action: download_github
    src: https://github.com/Rexshack-RedM/fdb-wardrobe
    ref: main
    dest: ./resources/[framework]/fdb-wardrobe

  - action: download_github
