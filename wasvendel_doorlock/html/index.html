<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wasvendel_doorlock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="admin-menu" class="admin-menu hidden">
        <div class="admin-container">
            <div class="admin-header">
                <button class="admin-lock-toggle locked" id="admin-lock-toggle" title="Toggle movement">
                    <svg class="lock-icon locked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <svg class="lock-icon unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 5.5-4.945M12 2v6"></path>
                        <path d="M7 11h10"></path>
                    </svg>
                </button>
                <div class="admin-title" id="menu-title">Door Lock Editor</div>
                <button class="admin-close" id="admin-close">✕</button>
            </div>
            <div class="admin-tabs hidden" id="admin-tabs">
                <button class="admin-tab active" data-tab="locks" id="tab-locks-label">Locks</button>
                <button class="admin-tab" data-tab="editor" id="tab-editor-label">Editor</button>
            </div>
            <div class="admin-content">
                <div id="tab-locks" class="admin-tab-content active">
                    <div class="zone-creator-wrapper">
                        <div class="zones-list-container" id="locks-list"></div>
                        <div class="zone-creator-header">
                            <button class="admin-button" id="create-lock-btn">New lock</button>
                        </div>
                    </div>
                </div>
                <div id="tab-editor" class="admin-tab-content">
                    <div class="zone-creator-content">
                        <form class="zone-creator-form" id="editor-form">
                            <div class="zone-form-content" id="editor-fields"></div>
                            <div class="zone-form-buttons">
                                <button type="button" class="admin-button" id="save-lock-btn">Save</button>
                                <button type="button" class="admin-button admin-button-secondary" id="cancel-edit-btn">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="confirmation-dialog" class="confirmation-dialog hidden">
        <div class="confirmation-overlay"></div>
        <div class="confirmation-content">
            <div class="confirmation-title" id="confirmation-title">Confirm</div>
            <div class="confirmation-message" id="confirmation-message"></div>
            <div class="confirmation-buttons">
                <button class="confirmation-btn confirmation-btn-cancel" id="confirmation-cancel">Cancel</button>
                <button class="confirmation-btn confirmation-btn-confirm" id="confirmation-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <div class="notification-message" id="notification-message"></div>
        </div>
    </div>

    <div id="door-pick-modal" class="door-pick-modal hidden">
        <div class="door-pick-overlay" id="door-pick-overlay"></div>
        <div class="door-pick-content">
            <div class="door-pick-title" id="door-pick-title">Select door</div>
            <div class="door-pick-list" id="door-pick-list"></div>
            <div class="door-pick-actions">
                <button type="button" class="confirmation-btn confirmation-btn-cancel" id="door-pick-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <div id="placement-hud" class="noclip-hud" aria-hidden="true">
        <div class="noclip-hud__inner">
            <div class="noclip-hud__head">
                <span class="noclip-hud__title" id="ph-title">Placement</span>
                <span class="noclip-hud__speed" id="ph-speed"></span>
            </div>
            <div class="noclip-hud__accent"></div>
            <ul class="noclip-hud__lines" id="ph-lines"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
